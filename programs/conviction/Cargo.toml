[package]
name = "conviction"
version = "0.1.0"
description = "Path A mini-season — team vs team game (Stonk Battles) on ER/PER/VRF"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "conviction"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
# idl-build must fan out to every dependency that contributes types to the IDL.
# anchor-spl was missing here in Phase A.2, which is why `anchor idl build`
# failed with E0599 on TokenAccount::create_type/insert_types/DISCRIMINATOR —
# those trait impls only exist under anchor-spl's own idl-build feature.
# Feature flags are compile-time-only for IDL generation; the deployed .so is
# unaffected.
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
# No-op feature placeholders to silence `unexpected_cfgs` warnings emitted by
# Anchor's internal `#[cfg(feature = "<X>")]` patterns. These are real
# upstream macros, not ours — declared here so Rust stops warning every ix
# file. All default OFF (empty dep list); the corresponding upstream branches
# are toggles we'd enable explicitly later if needed.
anchor-debug = []
custom-heap = []
custom-panic = []
solana = []

# NOTE: [profile.release] moved to the workspace root Cargo.toml in Phase B.
# Cargo ignores profile sections in workspace members, so keeping it here would
# silently do nothing (and emit a warning).

[dependencies]
# Anchor 1.0.x pairs with ephemeral-rollups-sdk 0.16.x via the "anchor" feature flag.
anchor-lang = { version = "1.0.2", features = ["init-if-needed"] }
# anchor-spl pairs with anchor-lang 1.0.x. Used for FTR mint + SPL token
# CPI in vote_on_proposal / reveal_round.
anchor-spl = "1.0.2"
# All three feature flags: anchor glue, PER CPIs, VRF + vrf_callback macros.
ephemeral-rollups-sdk = { version = "0.16.2", features = ["anchor", "access-control", "vrf"] }
