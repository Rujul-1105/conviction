# Cargo workspace root for the Conviction Anchor program.
#
# Phase B restores the standard Anchor layout (root Anchor.toml + root Cargo
# workspace + programs/<name>/) so that `anchor build` emits target/idl and
# target/types, which Phase A.2's standalone layout could not produce. The
# program crate itself is unchanged — src/lib.rs remains one flat compile unit
# per ADR 0002 (the Anchor macro hygiene issue blocking a module split).
[workspace]
members = ["programs/*"]
resolver = "2"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1

# ─────────────────────────────────────────────────────────────────────────────
# Vendor patch: anchor-syn 1.2.0
#
# Patches `pub(crate)` → `pub` on the `#[derive(Accounts)]` helper-module
# emission. Required so `#[program]`'s generated `pub use crate::__client_accounts_<ix>::*`
# resolves when the Accounts struct lives in a sub-module (per-ix split).
#
# See `programs/conviction/vendor/README.md` for full context and reversion
# instructions. Tracked in ADR 0002.
# ─────────────────────────────────────────────────────────────────────────────
[patch.crates-io]
anchor-syn = { path = "programs/conviction/vendor/anchor-syn" }
