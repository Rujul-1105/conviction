[toolchain]
package_manager = "yarn"

# Phase B: standard workspace layout restored so `anchor build` can emit
# target/idl/conviction.json + target/types/conviction.ts. The crate lives at
# programs/conviction but its [lib] name is "conviction", which is the key
# used under [programs.devnet] below.
[workspace]
members = ["programs/conviction"]

[features]
resolution = true
skip-lint = false

[programs.devnet]
conviction = "Fh6bQUgE35Hq7nP22GZ1Youwnph2UaiEh9xTtDJuHJbH"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "devnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "yarn run ts-mocha -p ./tsconfig.json -t 1000000 tests/**/*.ts"
